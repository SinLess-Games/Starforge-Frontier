[package]
name = "app"
version = "0.1.0"
description = "Starforge Frontier prototype built with TypeScript, Vite, React, Babylon.js, and Tauri."
authors = ["SinLess Games LLC"]
license = "UNLICENSED"
repository = "https://github.com/SinLess-Games/Starforge-Frontier"
edition = "2021"
# plist 1.10 (Tauri 2.11 macOS target) needs Rust 1.88 so quick-xml is 0.42.
# glib 0.18.5 stays: GHSA-wrw7-89jp-8q8g has no fix on Tauri's gtk 0.18 line.
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
